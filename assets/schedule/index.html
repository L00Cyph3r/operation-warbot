<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Operations Warbucks Streaming Schedule</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
          rel="stylesheet">
    <meta name="refresh" content="60"/>
</head>
<body>
<style>
    * {
        font-family: "Open Sans", sans-serif;
        font-optical-sizing: auto;
        font-weight: 400;
        font-style: normal;
        font-variation-settings: "wdth" 100;
    }

    .wrapper {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }

    #schedule {
        display: flex;
        flex-direction: column;
        gap: 1rem;
    }

    .item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px;
        gap: 10px;
        border-radius: 1rem;
        background-color: #222;
        color: #fff;
        width: 100%;
    }

    .time {
        display: inline-block;
    }

    .item.live {
        -webkit-box-shadow: 0px 0px 10px 10px rgba(255, 46, 46, 1);
        -moz-box-shadow: 0px 0px 10px 10px rgba(255, 46, 46, 1);
        box-shadow: 0 0px 10px 10px rgba(255, 46, 46, 1);
    }

    .streamer {
        text-align: left;
    }

    a, a:visited {
        color: #fff;
    }
</style>

<div class="wrapper">
    <h1>Operations Warbucks Streaming Schedule</h1>
    <h3>All these times are adjusted to your computer's timezone</h3>
    <div id="schedule">
    </div>
</div>

<script>
    let schedule = [

        {"start": 1778875200, "end": 1778886000, "streamers": [{"ShadeWave01": "ShadeWave01"}]},

        {"start": 1779123600, "end": 1779134400, "streamers": [{"TheSingingSailo": "The Singing Sailo"}]},
        {"start": 1779130800, "end": 1779141600, "streamers": [{"ApolloTheWhite": "ApolloTheWhite"}]},
        {"start": 1779138000, "end": 1779148800, "streamers": [{"CmdrAndrewJohnson": "CmdrAndrewJohnson"}]},
        {"start": 1779148800, "end": 1779148800, "streamers": [{"OrangePheonix": "OrangePheonix AFTERPARTY!"}]},
    ];
    schedule.sort((a, b) => a.start - b.start);
    schedule.forEach((item) => {
        let date = new Date(item.start * 1000);
        let dateString = date.toLocaleDateString(navigator.languages, {
            year: 'numeric',
            month: 'long',
            day: 'numeric',
        });
        let timeString = date.toLocaleTimeString(navigator.languages, {
            hour: 'numeric',
            minute: 'numeric',
            hour12: true,
        });
        let itemElement = document.createElement('div');
        itemElement.classList.add('item');
        let unix_now = Math.floor(Date.now() / 1000);

        let active = false;
        let streamers = item.streamers.map(streamer => {
            if (item.start <= unix_now && item.end >= unix_now) {
                active = true;
            }
            // console.log(Object.keys(streamer)[0]);
            // console.log(Object.values(streamer)[0]);
            return `<a href="https://twitch.tv/${Object.keys(streamer)[0]}" class="streamer">${Object.values(streamer)[0]}</a>`;
        }).join(' & ');
        console.log(streamers);
        itemElement.innerHTML = `
            <div class="time">
                <span class="date">${dateString}</span>
                <span class="time">${timeString}</span>
            </div>
            <span class="streamer">${streamers}</span>
        `;
        if (active) {
            itemElement.classList.add('live');
        }
        document.getElementById('schedule').appendChild(itemElement);
    })
</script>
</body>
</html>
