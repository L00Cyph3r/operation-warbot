        font-weight: 400;
        font-style: normal;
        font-variation-settings:
                "wdth" 100;

    .wrapper {
        width: 100%;
        height: 100%;

        justify-content: center;
        align-items: center;
    }

        padding: 10px;
        gap: 10px;
        border-radius: 1rem;
        background-color: #222;

    .time {
