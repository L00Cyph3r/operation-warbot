<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script src='script.js'></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&display=swap" rel="stylesheet">
</head>
<body>
<style>
    * {
        font-family: "Alfa Slab One", system-ui;
        font-weight: 400;
        font-style: normal;
    }

    html, body {
        height: 100%;
    }

    body {
        margin: 0;
    }

    .flex-container {
        height: 100%;
        padding: 0;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .row {
        width: auto;
    }

    #total {
        font-size: 14vw;
        text-align: center;
        color: mediumblue;
        -webkit-text-stroke: .05em darkorange;
    }

    #total.grow {
        animation: grow 2s ease-in-out;
    }

    @keyframes grow {
        0% {
            transform: scale(1);
        }
        50% {
            transform: scale(1.20);
        }
        100% {
            transform: scale(1);
        }
    }
</style>

<div class="flex-container">
    <div class="row">
        <div id="total"></div>
    </div>
</div>
</body>
</html>
